spring.application.name=agriMitra

# ===============================================
# Database Configuration (PostgreSQL)
# ===============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agrimitra}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# JPA / Hibernate Configuration
# ===============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================================
# Security / JWT Configuration
# ===============================================
spring.app.jwtSecret=${JWT_SECRET:}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# ===============================================
# AWS S3 Configuration
# ===============================================
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
aws.region=${AWS_REGION:ap-south-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# ===============================================
# Google Gemini Configuration
# ===============================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# ===============================================
# Weather API Configuration (OpenWeatherMap)
# ===============================================
weather.api.key=${OPENWEATHER_API_KEY:}
weather.api.base-url=${WEATHER_BASE_URL:https://api.openweathermap.org/data/2.5/weather}

# ===============================================
# Multipart File Upload Configuration
# ===============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
